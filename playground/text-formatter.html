<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Norman Salas - Text Formatter. Format and transform text with one click."
    />
    <title>Text Formatter · SalasNorman</title>
    <link rel="icon" type="image/png" href="../assets/images/favicon.png" />
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/layout.css" />
    <link rel="stylesheet" href="../css/header.css" />
    <link rel="stylesheet" href="../css/footer.css" />
    <link rel="stylesheet" href="../css/tools/text-formatter.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
  </head>
  <body>
    <header id="site-header" class="header"></header>

    <main class="layout">
      <div class="layout__inner layout__inner--wide">
        <h1 class="visually-hidden">Text Formatter</h1>
        <div class="tf">
          <div class="tf__header">
            <span class="tf__title">Text Formatter</span>
          </div>

          <div class="tf__actions">
            <select id="tf-font" class="tf__select tf__font" aria-label="Font style"></select>
            <div id="tf-chips-deco" class="tf__chips"></div>
              <button id="tf-copy" class="tf__btn tf__btn--icon tf__btn--copy push-btn" title="Copy to clipboard" aria-label="Copy to clipboard">
                <i class="bi bi-copy"></i>
              </button>
            <button id="tf-drawer-toggle" class="tf__btn push-btn" title="Transform">
              <i class="bi bi-magic"></i> Transform
            </button>
          </div>

          <div class="tf__tabs">
            <button id="tf-tab-edit" class="tf__tab tf__tab--active">Edit</button>
            <button id="tf-tab-preview" class="tf__tab">Preview</button>
          </div>

          <textarea id="tf-editor" class="tf__textarea" placeholder="Paste your text here..."></textarea>
        </div>
      </div>

      <div id="tf-backdrop" class="tf__backdrop" hidden></div>

      <div id="tf-drawer" class="tf__drawer" hidden>
        <div class="tf__drawer-header">
          <span class="tf__drawer-title">Transform</span>
          <button id="tf-drawer-close" class="tf__drawer-close" title="Close">
            <i class="bi bi-x"></i>
          </button>
        </div>
        <div id="tf-drawer-body" class="tf__drawer-body"></div>
      </div>
    </main>

    <footer id="site-footer" class="footer"></footer>
    <script type="module" src="../js/main.js"></script>
    <script src="../js/tools/text-formatter.js"></script>
  </body>
</html>
