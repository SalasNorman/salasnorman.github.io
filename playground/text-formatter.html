<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Norman Salas - Text Formatter. Format and transform text with one click."
    />
    <title>Text Formatter · SalasNorman</title>
    <link rel="icon" type="image/png" href="../assets/images/favicon.png" />
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/layout.css" />
    <link rel="stylesheet" href="../css/header.css" />
    <link rel="stylesheet" href="../css/footer.css" />
    <link rel="stylesheet" href="../css/tools/text-formatter.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
  </head>
  <body>
    <header id="site-header" class="header"></header>

    <main class="layout">
      <div class="layout__inner layout__inner--wide">
        <h1 class="visually-hidden">Text Formatter</h1>
        <div class="tf">
          <div class="tf__header">
            <span class="tf__title">Text Formatter</span>
          </div>

          <div class="tf__actions">
            <select id="tf-font" class="tf__select tf__font push-btn" aria-label="Font style"></select>
            <select id="tf-case" class="tf__select tf__case push-btn" aria-label="Case style">
              <option value="">Case</option>
              <option value="upper">UPPERCASE</option>
              <option value="lower">lowercase</option>
              <option value="title">Title Case</option>
              <option value="sentence">Sentence case</option>
              <option value="camel">camelCase</option>
              <option value="pascal">PascalCase</option>
              <option value="snake">snake_case</option>
              <option value="kebab">kebab-case</option>
            </select>
            <div id="tf-chips-deco" class="tf__chips"></div>
          </div>

          <div class="tf__pane">
            <div class="tf__pane__head">
              <label class="tf__pane__title" for="tf-input">Edit</label>
            </div>
            <textarea id="tf-input" class="tf__textarea" placeholder="Paste your text here..."></textarea>
          </div>

          <div class="tf__pane">
            <div class="tf__pane__head">
              <label class="tf__pane__title" for="tf-output">Preview</label>
            </div>
            <div class="tf__pane__body">
              <textarea id="tf-output" class="tf__textarea" readonly placeholder="Formatted text appears here..."></textarea>
              <button id="tf-copy" class="tf__btn tf__btn--icon tf__btn--float push-btn" title="Copy to clipboard" aria-label="Copy to clipboard">
                <i class="bi bi-copy"></i>
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer id="site-footer" class="footer"></footer>
    <script type="module" src="../js/main.js"></script>
    <script src="../js/tools/text-formatter.js"></script>
  </body>
</html>
