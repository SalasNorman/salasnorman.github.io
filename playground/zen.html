<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Norman Salas - Offline Notepad. A minimal distraction-free text editor with markdown support."
    />
    <title>Offline Notepad · SalasNorman</title>
    <link rel="icon" type="image/png" href="../assets/images/favicon.png" />
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/layout.css" />
    <link rel="stylesheet" href="../css/header.css" />
    <link rel="stylesheet" href="../css/footer.css" />
    <link rel="stylesheet" href="../css/tools/zen.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
  </head>
  <body>
    <header id="site-header" class="header"></header>

    <main class="layout">
      <div class="layout__inner layout__inner--wide">
        <h1 class="visually-hidden">Offline Notepad</h1>
        <div class="zen">
      <div class="zen__toolbar">
        <div class="zen__toolbar-row">
          <span class="zen__title">Offline Notepad</span>
          <span class="zen__credit">Inspired by <a href="https://zen.unit.ms/" target="_blank" rel="noopener">Zen</a></span>
        </div>
        <div class="zen__toolbar-row">
          <select id="zen-font" class="zen__select push-btn">
            <option value="IBM Plex Mono">IBM Plex Mono</option>
            <option value="Georgia">Georgia</option>
            <option value="Arial">Arial</option>
            <option value="Courier New">Courier New</option>
          </select>
          <select id="zen-font-size" class="zen__select push-btn">
            <option value="10">10</option>
            <option value="12">12</option>
            <option value="14">14</option>
            <option value="16" selected>16</option>
            <option value="18">18</option>
          </select>
          <button id="zen-fullscreen" class="zen__btn push-btn" title="Fullscreen">
            <i class="bi bi-arrows-fullscreen"></i>
          </button>
          <button id="zen-markdown" class="zen__btn push-btn" title="Markdown mode">
            <i class="bi bi-markdown"></i>
          </button>
          <button id="zen-find" class="zen__btn push-btn" title="Find and replace">
            <i class="bi bi-search"></i>
          </button>
          <div class="zen__download-wrap">
            <button id="zen-download" class="zen__btn push-btn" title="Download">
              <i class="bi bi-download"></i>
            </button>
            <div id="zen-download-menu" class="zen__download-menu" hidden>
              <button id="zen-download-txt" class="zen__download-item">.txt</button>
              <button id="zen-download-md" class="zen__download-item">.md</button>
            </div>
          </div>
        </div>
      </div>

      <div id="zen-find-bar" class="zen__find-bar" hidden>
        <input id="zen-find-input" class="zen__find-input" type="text" placeholder="Find..." aria-label="Find" />
        <button id="zen-find-next" class="zen__btn zen__btn--small push-btn" title="Next">
          <i class="bi bi-chevron-down"></i>
        </button>
        <button id="zen-replace-one" class="zen__btn zen__btn--small zen__btn--text push-btn" title="Replace">Replace</button>
        <input id="zen-replace-input" class="zen__find-input" type="text" placeholder="Replace..." aria-label="Replace with" />
        <button id="zen-find-prev" class="zen__btn zen__btn--small push-btn" title="Previous">
          <i class="bi bi-chevron-up"></i>
        </button>
        <button id="zen-replace-all" class="zen__btn zen__btn--small zen__btn--text push-btn" title="Replace all">Replace all</button>
      </div>

      <div id="zen-notes" class="zen__notes"></div>

      <div class="zen__editor">
        <div id="zen-seg" class="zen__seg" hidden role="group" aria-label="View mode">
          <button type="button" id="zen-seg-edit" class="zen__seg__btn zen__seg__btn--active">Edit</button>
          <button type="button" id="zen-seg-preview" class="zen__seg__btn">Preview</button>
        </div>
        <div id="zen-content" class="zen__content" contenteditable="true" data-placeholder="Start writing..."></div>
        <div id="zen-preview" class="zen__preview" hidden></div>
      </div>

      <div class="zen__stats">
        <span id="zen-words">0 words</span>
        <span id="zen-chars">0 characters</span>
      </div>
    </div>
    </div>
    </main>

    <footer id="site-footer" class="footer"></footer>
    <script type="module" src="../js/main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/showdown@2.1.0/dist/showdown.min.js"></script>
    <script src="../js/tools/zen.js"></script>
  </body>
</html>
