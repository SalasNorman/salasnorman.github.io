<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Norman Salas - Projects. Venvoice mobile app."
    />
    <title>Projects — Norman Salas</title>
    <link rel="icon" type="image/png" href="assets/images/favicon.png" />
    <link rel="stylesheet" href="css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
  </head>
  <body>
    <header class="header">
      <a href="index.html" class="header__logo">SalasNorman</a>
      <nav class="header__nav">
        <div class="header__nav-links">
          <a href="index.html">Home</a>
          <a href="resume.html">Resume</a>
          <a href="projects.html" class="active">Projects</a>
        </div>
        <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">
          <i id="toggle-icon" class="bi bi-sun"></i>
        </button>
        <button class="hamburger" id="hamburger" aria-label="Menu">
          <i class="bi bi-list"></i>
        </button>
      </nav>
    </header>

    <div class="layout">
      <div class="layout__inner">
        <h2 class="projects__title">Projects</h2>

        <div class="project">
          <div class="project__header">
            <img class="project__logo" src="https://github.com/SalasNorman/venvoice/raw/main/assets/icon.png" alt="Venvoice logo" />
            <h3 class="project__name">Venvoice</h3>
          </div>
          <p class="project__desc">
            A mobile app that helps market vendors record, organize, and loop voice promotions to attract customers without losing their voice.
          </p>
          <div class="project__tags">
            <span class="project__tag">React Native</span>
            <span class="project__tag">Expo</span>
            <span class="project__tag">JavaScript</span>
          </div>
          <div class="project__actions">
            <a href="https://github.com/SalasNorman/venvoice/releases" target="_blank" rel="noopener" class="project__button">
              <img src="assets/icons/material-symbols--apk-install-outline.svg" alt="" class="project__btn-icon" />
              Install App
            </a>
            <a href="https://github.com/SalasNorman/venvoice" target="_blank" rel="noopener" class="project__button">
              <img src="assets/icons/ri--github-fill.svg" alt="" class="project__btn-icon" />
              Source
            </a>
          </div>
        </div>
      </div>
    </div>

    <footer class="footer">&copy; SalasNorman</footer>
    <script src="js/script.js"></script>
  </body>
</html>
